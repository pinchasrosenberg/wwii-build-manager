name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Tests (Python + dashboard JS; fake CLIs, no network, no LLM)
        run: python -m unittest discover -s tests -p 'test_*.py'
